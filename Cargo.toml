[workspace]
members = [
    "crates/hf-core",
    "crates/hf-services",
    "crates/hf-center",
    "crates/hf-agent",
    "crates/hf-cli",
    "crates/hf-dispatcher",
    "crates/kazik-protocol",
    "honeypots/pritvoryashka",
]
exclude = ["backend", "honeypots/kozyavka"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ssh2 = "0.9"
thiserror = "2.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "process", "signal", "time", "net", "sync", "io-util", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
uuid = { version = "1.13", features = ["v4", "serde"] }
